syntax = "proto3";
package suiApi;

import "base.proto";

option cc_generic_services = true;

//图像文件上传
message httpUploadImageReq {}

//RPC图像文件上传
message uploadImageReq {
  optional string id = 1;
  optional string sessionId = 2;
  FileInfo fileInfo = 3;
}

message uploadImageResult {
  optional string fileId = 1;
}

message uploadImageRsp {
  optional string id = 1;
  optional int32 errorCode = 2;
  optional string errorMsg = 3;
  // 依据之前的接口惯例，响应通常包含一个 result 结构体
  uploadImageResult result = 4;
}

//图片下载
message httpDownloadImageReq {}

message downloadImageReq {
  optional string id = 1;
  optional string sessionId = 2;
  optional string fileId = 3;
}

message downloadImageRsp {
  optional string id = 1;
  optional int32 errorCode = 2;
  optional string errorMsg = 3;
  FileInfo fileInfo = 4;
}

//文件上传
//发送单个分片
message httpUploadFileReq {}
message uploadFileParam {
  //文件与分片相关
  optional int32 chunkIndex = 1; // 当前是第几个分片 (从 0 开始)
  optional int32 chunkTotal = 2; //总数
  optional int32 fileSize = 3; //文件大小
  optional string fileMime = 4; //文件MIME类型
  //上传定位
  optional string uploadId = 5; // 上传id 用于后续数据定位
  optional string fileId = 6; // 追加的文件ID 为空说明是首次上传
  optional string filePath = 7;
  //数据相关
  optional string chunkMd5 = 8; // 当前这一小块分片的 MD5
  optional bytes chunkData = 9; // 二进制分片数据本体
}
message uploadFileReq {
  optional string id = 1;
  optional string sessionId = 2;
  uploadFileParam param = 3;
}

//
message uploadFileResult {
  optional string fileId = 1;
  optional string uploadId = 2;
  optional int32 curOperationSize = 3; //出现错误时，如果是顺序错误，通过这个字段返回所需要的分片索引
}
message uploadFileRsp {
  optional string id = 1;
  optional int32 errorCode = 2;
  optional string errorMsg = 3;
  uploadFileResult result = 4;
}

//发送完成上传请求
message httpCompleteVideoUploadReq {}
message completeVideoUploadParam {
  //上传定位
  optional string fileId = 1;
  optional string uploadId = 2;
}
message completeVideoUploadReq {
  optional string id = 1;
  optional string sessionId = 2;
  completeVideoUploadParam param = 3;
}

//
message completeVideoUploadRsp {
  optional string id = 1;
  optional int32 errorCode = 2;
  optional string errorMsg = 3;
}

//视频下载
//请求分片下载
message httpInitGetVideoDataReq {}
message InitGetVideoDataParm {
  optional string fileId = 1;
}
message InitGetVideoDataReq {
  optional string id = 1;
  optional string sessionId = 2;
  InitGetVideoDataParm param = 3;
}

//
message InitGetVideoDataResult {
  optional int32 downChunkTotal = 1; // 分片总数
  optional int32 fileSize = 2; //文件总大小
}
message InitGetVideoDataRsp {
  optional string id = 1;
  optional int32 errorCode = 2; //错误码是0表示成功，其他表示失败
  optional string errorMsg = 3;
  InitGetVideoDataResult result = 4; //不装数据，只存储元信息
}

//文件分片下载
message httpDownloadVideoReq {}
message downloadVideoParam {
  //定位
  optional int32 chunkIndex = 1; // 请求下载第几个分片
  optional string fileId = 2; // 文件ID
}
message downloadVideoReq {
  optional string id = 1;
  optional string sessionId = 2;
  downloadVideoParam param = 3;
}

message downloadVideoResult {
  // 凭证与定位
  optional int32 chunkIndex = 1; // 当前是第几个分片 (从 0 开始)
  // 数据安全与本体
  optional string chunkMd5 = 2; // 当前这一小块分片的 MD5，防止网络传输抖动
  optional bytes chunkData = 3; // 二进制分片数据本体
}
message downloadVideoRsp {
  optional string id = 1;
  optional int32 errorCode = 2;
  optional string errorMsg = 3;
  downloadVideoResult result = 4;
}

service fileServices {
  rpc uploadImage(uploadImageReq) returns (uploadImageRsp);
  rpc downloadImage(downloadImageReq) returns (downloadImageRsp);

  //请求视频上传
  rpc uploadFile(uploadFileReq) returns (uploadFileRsp);
  rpc completeVideoUpload(completeVideoUploadReq) returns (completeVideoUploadRsp);

  //请求分片下载
  rpc getVideoData(InitGetVideoDataReq) returns (InitGetVideoDataRsp);
  rpc downloadVideo(downloadVideoReq) returns (downloadVideoRsp);
}
